<head data-page-node-id="xMxjJt97mHZlFw7gSd47j2">
<meta charset="UTF-8" data-page-node-id="8vPe1m3AdieNxbEEHrjOUk">

<title>密室逃脱 · 布局示例 v1（方案一沉浸式）</title>
<style>
  :root{
    --bg:#141019; --panel:rgba(20,16,28,.82); --panel-border:rgba(255,255,255,.10);
    --accent:#c9a15c; --accent2:#8a6dc9; --text:#efe9dd; --dim:#a89f92;
    --danger:#d4886a; --ok:#7fbf7f;
  }
  *{margin:0;padding:0;box-sizing:border-box;user-select:none}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif}

  /* ===== 场景层（全屏沉浸，底图铺满整个屏幕） ===== */
  #scene{position:fixed;inset:0;}
  #scene svg{width:100%;height:100%;display:block}
  .hotspot{position:absolute;transform:translate(-50%,-50%);
    background:rgba(15,12,20,.55);border:1px solid rgba(255,255,255,.25);
    color:var(--text);padding:6px 12px;border-radius:20px;cursor:pointer;
    font-size:14px;backdrop-filter:blur(3px);transition:.15s;white-space:nowrap}
  .hotspot:hover{background:var(--accent);color:#1c1408;border-color:var(--accent)}

  /* ===== 顶部 HUD ===== */
  #hud{position:fixed;top:0;left:0;right:240px;display:flex;gap:10px;
    padding:12px 16px;pointer-events:none;z-index:20;align-items:flex-start}
  .hud-chip{background:var(--panel);border:1px solid var(--panel-border);
    border-radius:8px;padding:6px 14px;font-size:13px;pointer-events:auto}
  #levelTabs{display:flex;gap:6px}
  .lvl-tab{cursor:pointer}
  .lvl-tab.active{background:var(--accent);color:#1c1408;font-weight:bold}
  #progressWrap{flex:1;max-width:320px;height:8px;margin-top:8px;
    background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
  #progressBar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .4s}

  /* ===== 右侧边栏（背包 / 线索）—— 更窄 + 低透明度，可透出场景底图 ===== */
  #sidebar{position:fixed;top:0;right:0;bottom:0;width:240px;z-index:60;
    background:rgba(18,14,26,.45);border-left:1px solid rgba(255,255,255,.08);
    display:flex;flex-direction:column;backdrop-filter:blur(2px)}
  #sideTabs{display:flex;border-bottom:1px solid var(--panel-border)}
  .side-tab{flex:1;padding:14px 0;text-align:center;cursor:pointer;font-size:15px;
    color:var(--dim);border-bottom:2px solid transparent}
  .side-tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:bold}
  .side-tab .badge{display:inline-block;min-width:18px;padding:1px 5px;margin-left:4px;
    border-radius:9px;background:var(--accent);color:#1c1408;font-size:11px}
  #sideBody{flex:1;overflow-y:auto;padding:12px}
  .inv-item{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:8px;
    background:rgba(255,255,255,.05);border:1px solid var(--panel-border);
    border-radius:8px;cursor:pointer;font-size:14px;transition:.15s}
  .inv-item:hover{border-color:var(--accent)}
  .inv-item .em{font-size:20px}
  .clue-item{padding:9px 10px;margin-bottom:8px;background:rgba(255,255,255,.04);
    border-left:3px solid var(--accent2);border-radius:0 8px 8px 0;font-size:13px;
    color:var(--dim);line-height:1.5}
  .empty-hint{text-align:center;color:var(--dim);font-size:13px;padding:30px 10px;line-height:1.8}

  /* ===== 底部旁白框 —— 图层在最上（压过边栏），低透明度透出场景 ===== */
  #narration{position:fixed;left:16px;right:16px;bottom:14px;z-index:70;
    background:rgba(15,12,20,.5);border:1px solid rgba(255,255,255,.08);border-radius:12px;
    padding:14px 18px;min-height:78px;max-height:150px;overflow-y:auto;
    font-size:14.5px;line-height:1.7;backdrop-filter:blur(2px)}
  #narration .narr-old{color:var(--dim)}
  #narration .narr-new{color:var(--text)}
  #narration .narr-ok{color:var(--ok)}
  #narration .narr-err{color:var(--danger)}

  /* ===== 特写弹窗（居中 2/3） ===== */
  #modalMask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;
    display:none;align-items:center;justify-content:center;padding-bottom:180px}
  #modalMask.show{display:flex}
  #closeup{width:66vw;max-width:900px;height:76vh;background:#1b1524;
    border:1px solid var(--panel-border);border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #closeupHead{display:flex;justify-content:space-between;align-items:center;
    padding:12px 18px;border-bottom:1px solid var(--panel-border)}
  #closeupHead h3{font-size:16px;color:var(--accent)}
  #closeupClose{cursor:pointer;background:none;border:none;color:var(--dim);font-size:20px}
  #closeupBody{flex:1;display:flex;flex-direction:column;min-height:0}
  #closeupImg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    background:#0e0b13;position:relative}
  #closeupImg svg{max-width:62%;max-height:92%}
  #closeupBottom{flex:none;height:26%;display:flex;flex-direction:column;gap:6px;
    justify-content:flex-end;padding:10px 16px;min-height:0;
    border-top:1px solid var(--panel-border);overflow-y:auto}
  #closeupDesc{flex:none;font-size:12.5px;color:var(--dim);line-height:1.5}
  #closeupActs{flex:none;display:flex;flex-direction:column;gap:6px}
  .act-btn{padding:8px;border-radius:8px;border:1px solid var(--panel-border);
    background:rgba(255,255,255,.06);color:var(--text);font-size:13px;cursor:pointer;
    text-align:center;transition:.15s}
  .act-btn:hover{background:var(--accent);color:#1c1408}
  .act-btn.primary{border-color:var(--accent);color:var(--accent)}
  .act-btn.primary:hover{color:#1c1408}
  .act-btn:disabled{opacity:.35;cursor:not-allowed}
  .act-btn:disabled:hover{background:rgba(255,255,255,.06);color:var(--text)}

  /* ===== 密码输入弹窗 ===== */
  #pwdMask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;
    display:none;align-items:center;justify-content:center;padding-bottom:180px}
  #pwdMask.show{display:flex}
  #pwdBox{background:#1b1524;border:1px solid var(--panel-border);border-radius:16px;
    padding:24px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7)}
  #pwdBox h3{margin-bottom:6px;color:var(--accent);font-size:15px}
  #pwdBox .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  #pwdDots{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
  .pwd-dot{width:38px;height:48px;border:1px solid var(--panel-border);border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:22px;
    background:rgba(255,255,255,.05);color:var(--accent);font-family:monospace}
  #pwdPad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pad-key{padding:13px 0;border-radius:8px;border:1px solid var(--panel-border);
    background:rgba(255,255,255,.06);color:var(--text);font-size:17px;cursor:pointer}
  .pad-key:active{background:var(--accent);color:#1c1408}
  .pad-key.ok{border-color:var(--accent);color:var(--accent)}
  .pad-key.cancel{border-color:var(--danger);color:var(--danger)}
  #pwdMsg{margin-top:10px;font-size:12px;color:var(--danger);min-height:16px}

  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
</style>
</head>

<script>
/* =====================================================================
   布局示例 · 纯前端 Mock（不连后端）
   方案一「沉浸式全屏」+ 用户 4 点优化：
   1. 背包/线索 = 右侧边栏，顶部切换口
   2. 密码输入 = 独立弹窗（按键键盘）
   3. 点击场景按钮 = 居中特写弹窗（66% 宽 ≈ 2/3 屏）
   4. 配套三关场景布局图（见 SVG 布局图 / 坐标即本页热点坐标）
   ===================================================================== */

/* ---------- 三关场景背景（占位 SVG，正式版换 AI 插画） ---------- */

  <!-- 画框 -->
  <rect x="560" y="120" width="170" height="130" fill="#8a6a3a" rx="4"/>
  <rect x="572" y="132" width="146" height="106" fill="#c8b48a" rx="2"/>

  <!-- 钟表 -->

  <line x1="840" y1="180" x2="862" y2="180" stroke="#333" stroke-width="3"/>
  <!-- 书桌 -->
  <rect x="420" y="420" width="320" height="26" fill="#5a4228"/>
  <rect x="440" y="446" width="40" height="110" fill="#4a3421"/>

  <!-- 保险箱 -->

</svg>`}

  <defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">

/* ---------- 物品特写占位 SVG ---------- */
function closeupArt(emoji,bg){
  return `<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="220" rx="12" fill="${bg}"/>
  <rect x="10" y="10" width="280" height="200" rx="10" fill="none" stroke="rgba(255,255,255,.12)"/>
  <text x="150" y="130" font-size="86" text-anchor="middle">${emoji}</text></svg>`}

/* ---------- 关卡配置（热点坐标 = 场景布局图坐标） ---------- */
const ROOMS = {
  study: {
    name:"第 1 关 · 书房", bg:bgStudy, progress:0,
    objects:[
      {id:"bookshelf",     name:"📚 书架",   x:16, y:44, emoji:"📚", art:"#2c2118",
       desc:"一排排旧书按年份排列。1934 年到 1998 年，唯独 1939 年那本是倒着插的。"},
      {id:"picture_frame", name:"🖼 画框",   x:50, y:24, emoji:"🖼", art:"#33281a",
       desc:"墙上的旧画框有些歪斜，画布一角翘了起来。"},
      {id:"clock",         name:"🕰 钟表",   x:66, y:26, emoji:"🕰", art:"#2e2620",
       desc:"老式挂钟，指针停着不动——齿轮箱少了一个零件。"},

/* 铁皮盒刻度盘：向左/向右每次一格（1-12 循环），正好停在 6 弹开 */
function stepDial(d){
  G.dial = d>0 ? (G.dial>=12?1:G.dial+1) : (G.dial<=1?12:G.dial-1);
  if(G.dial===6){
    G.used.add("tin"); addItem("old_key");
    addClue("刻度盘停在 6——铁皮盒弹开，里面有把旧钥匙");
    narr("刻度盘正好停在 6——「咔哒」！旧铁皮盒弹开了。","narr-ok");
  }else{
    narr("刻度盘停在 "+G.dial+"——盒子毫无反应。（贴纸上的旋钮停在某个刻度……）");
  }
  openCloseup(curObj);   // 重渲染特写，刷新当前位置
}
const $=q=>document.querySelector(q);

/* ---------- 旁白 ---------- */
function narr(msg, cls){
  const box=$("#narration");
  box.querySelectorAll(".narr-new").forEach(n=>n.classList.replace("narr-new","narr-old"));
  const div=document.createElement("div");
  div.className="narr-new "+(cls||""); div.textContent=msg;
  box.appendChild(div);
  while(box.children.length>4) box.removeChild(box.firstChild);
  box.scrollTop=box.scrollHeight;
}

/* ---------- 物品拾取 / 查看 ---------- */
function addItem(id, silent){
  if(G.inv.some(i=>i.id===id)) return false;
  G.inv.push({id, name:ITEMS[id].name, icon:ITEMS[id].icon});
  if(!silent) narr(`拾取了「${ITEMS[id].name}」→ 已放入背包`, "narr-ok");
  renderSide(); return true;
}
function addClue(txt){
  if(G.clues.includes(txt)) return;
  G.clues.push(txt); narr(`💡 线索已记录：${txt}`); renderSide();
}
function removeItem(id){
  G.inv=G.inv.filter(i=>i.id!==id); renderSide();
}
function inspectItem(id){
  closeCloseup();
  narr(`${ITEMS[id].icon} ${ITEMS[id].name}：${ITEMS[id].inspect}`);
  addClue(`${ITEMS[id].name} — ${ITEMS[id].inspect}`);
}

/* ---------- 密码弹窗 ---------- */
let pwdBuf="", pwdCfg=null;
function openPwd(cfg){
  pwdCfg=cfg; pwdBuf="";
  $("#pwdTitle").textContent="输入密码";
  $("#pwdSub").textContent=`${cfg.len} 位数字密码`;
  renderDots(); renderPad();
  $("#pwdMsg").textContent="";
  $("#pwdMask").classList.add("show");
}
function renderDots(){
  $("#pwdDots").innerHTML=Array.from({length:pwdCfg.len},(_,i)=>
    `<div class="pwd-dot">${pwdBuf[i]||""}</div>`).join("");
}
function renderPad(){
  const keys=["1","2","3","4","5","6","7","8","9","C","0","OK"];
  $("#pwdPad").innerHTML=keys.map(k=>
    `<div class="pad-key ${k==="OK"?"ok":k==="C"?"cancel":""}" data-k="${k}">${k}</div>`).join("");
  document.querySelectorAll(".pad-key").forEach(el=>el.onclick=()=>padPress(el.dataset.k));
}
function padPress(k){
  const msg=$("#pwdMsg");
  if(k==="C"){pwdBuf=""; msg.textContent=""; }
  else if(k==="OK"){
    if(pwdBuf.length<pwdCfg.len){msg.textContent=`还差 ${pwdCfg.len-pwdBuf.length} 位`;return;}
    if(pwdBuf===pwdCfg.code){ pwdOk(); return; }
    msg.textContent="密码错误，锁纹丝不动。"; pwdBuf="";
  }
  else if(pwdBuf.length<pwdCfg.len) pwdBuf+=k;
  renderDots();
}
function pwdOk(){
  $("#pwdMask").classList.remove("show");
  const cfg=pwdCfg;
  if(cfg.target==="safe"){
    G.used.add("safe_open"); addItem("study_key");
    addClue("保险箱 397 开启，取得书房门钥匙"); G.progress.study=85;
    narr("转盘咔哒三声——保险箱开了，里面是一把黄铜钥匙。","narr-ok");
  }
  if(cfg.target==="garage_door"){
    G.used.add("l2_done");
    addClue("车库门密码 3728 正确"); G.progress.living_room=80;
    narr("电子屏绿灯亮起，卷帘门缓缓升起——你走进了车库。","narr-ok");
    setTimeout(()=>switchRoom("garage"),1200);
  }
  if(cfg.target==="keypad"){
    G.used.add("l3_screen");
    addClue("电子屏 529 正确，绿灯亮起、玻璃面板弹开");
    narr("屏幕亮起绿灯，透明玻璃面板「咔」地弹开——露出上、下两个箭头键。","narr-ok");
  }
  refresh();
}
$("#pwdMask").onclick=e=>{if(e.target.id==="pwdMask")$("#pwdMask").classList.remove("show");};

/* 电子屏上下箭头弹窗：只有 ↑↓ 两个按钮，按门态分流
   门未开：↑ 升起卷帘门 / ↓ 没有动静；门已开：↑ 没有动静 / ↓ 落下卷帘门 */
function openArrowModal(){
  const mask=document.createElement("div");
  mask.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;";
  const box=document.createElement("div");
  box.style.cssText="background:#241f30;border:1px solid #c9a86a;border-radius:12px;padding:22px;min-width:260px;text-align:center;color:#e8e2d5;";
  box.innerHTML='<h3 style="color:#c9a86a;margin:0 0 16px;font-size:16px;">⬆⬇ 电子屏 · 玻璃面板已弹开</h3>';
  const bcss="display:block;width:100%;margin:8px 0;padding:12px 0;border-radius:8px;border:1px solid #4a4258;background:#2a2436;color:#e8e2d5;font-size:16px;cursor:pointer;";
  const up=document.createElement("button");
  up.textContent="⬆ 向上箭头"; up.style.cssText=bcss;
  up.onclick=()=>{ mask.remove();
    if(G.used.has("l3_shutter")){ narr("卷帘门已经升到顶了——再按向上箭头，电机只空转了一声，没有别的动静。"); }
    else{ G.used.add("l3_shutter"); addClue("卷帘门缓缓升起");
      narr("你按下向上箭头——卷帘门在电机声中缓缓升起！","narr-ok");
      G.progress.garage=95; }
    refresh();};
  const down=document.createElement("button");
  down.textContent="⬇ 向下箭头"; down.style.cssText=bcss;
  down.onclick=()=>{ mask.remove();
    if(!G.used.has("l3_shutter")){ narr("你按下向下箭头——没有任何动静。卷帘门纹丝不动。"); }
    else{ G.used.delete("l3_shutter"); addClue("卷帘门落回轨道");
      narr("你按下向下箭头——卷帘门轰隆隆落下，重新压回轨道。（再按向上箭头可重新升起）");
      G.progress.garage=85; }
    refresh();};
  box.appendChild(up); box.appendChild(down);
  mask.appendChild(box); document.body.appendChild(mask);
  mask.onclick=e=>{if(e.target===mask)mask.remove();};
}

/* ---------- 通关（白底全屏结算界面） ---------- */
function win(how){
  addClue(`通关方式：${how}`);
  G.progress.garage=100; refresh();
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:#fff;z-index:400;display:flex;align-items:center;justify-content:center;";
  ov.innerHTML='<div style="text-align:center;color:#1a1622;padding:40px;max-width:560px;">'
    +'<h2 style="font-size:36px;margin:0 0 14px;">🏆 通关！</h2>'
    +'<p style="color:#4a4458;line-height:1.9;margin:0 0 28px;">你走出卷帘门，逃出了密室！（'+how+' 通关）</p>'
    +'<button onclick="location.reload()" style="background:#1a1622;color:#fff;border:none;padding:12px 36px;border-radius:8px;font-size:16px;cursor:pointer;">再玩一次</button>'
    +'</div>';
  document.body.appendChild(ov);
}

/* ---------- 关卡切换 ---------- */
function switchRoom(id){
  if(id==="living_room" && G.room==="study"){addItem("demo_note",true); removeItem("demo_note");}
  G.room=id;
  renderRoom(); closeCloseup();
  const names={study:"书房", living_room:"客厅", garage:"车库"};
  narr(`—— 你来到了${names[id]} ——`);
}
document.querySelectorAll(".lvl-tab").forEach(t=>
  t.onclick=()=>{switchRoom(t.dataset.lvl);
    document.querySelectorAll(".lvl-tab").forEach(x=>x.classList.toggle("active",x===t));});

/* ---------- 场景渲染 ---------- */
function renderRoom(){
  const cfg=ROOMS[G.room];
  $("#levelName").textContent=cfg.name;
  $("#bgHolder").innerHTML=cfg.bg();
  $("#hotspotHolder").innerHTML=cfg.objects.map(o=>
    `<button class="hotspot" style="left:${o.x}%;top:${o.y}%" data-id="${o.id}">${o.name}</button>`).join("");
  document.querySelectorAll(".hotspot").forEach(el=>
    el.onclick=()=>openCloseup(cfg.objects.find(o=>o.id===el.dataset.id)));
  refresh();
}
function refresh(){
  const p=G.progress[G.room];
  $("#progressBar").style.width=p+"%";
  $("#progressTxt").textContent=p+"%";
  renderSide();
}

/* ---------- 启动 ---------- */
renderRoom();
narr("你在一间陌生的书房里醒来。唯一的出路，是一环扣一环的谜。");
narr("（布局示例：点击场景热点查看特写，右侧栏管理背包与线索。纯前端 Mock，未连后端。）");
</script>
