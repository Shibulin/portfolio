<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TextRoom — AI 密室逃脱</title>
<style>
  :root{
    --bg:#141019; --panel:rgba(20,16,28,.82); --panel-border:rgba(255,255,255,.10);
    --accent:#c9a15c; --accent2:#8a6dc9; --text:#efe9dd; --dim:#a89f92;
    --danger:#d4886a; --ok:#7fbf7f;
  }
  *{margin:0;padding:0;box-sizing:border-box;user-select:none}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif}

  /* ===== 开始页：白底居中 ===== */
  #cover{position:fixed;inset:0;background:#fff;z-index:200;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
  .cover-title{font-size:56px;letter-spacing:6px;color:#1a1a1a;font-weight:600}
  .cover-btn{font-size:32px;letter-spacing:4px;color:#1a1a1a;background:transparent;
    border:1px solid #1a1a1a;padding:10px 36px;border-radius:4px;cursor:pointer;
    transition:.2s;font-family:inherit}
  .cover-btn:hover{background:#1a1a1a;color:#fff}
  .cover-btn:disabled{opacity:.5;cursor:wait}

  /* ===== 场景层（全屏沉浸，底图铺满整个屏幕） ===== */
  #scene{position:fixed;inset:0}
  #bg{width:100%;height:100%;object-fit:cover;display:block}
  .hotspot{position:absolute;transform:translate(-50%,-50%);
    background:linear-gradient(145deg,rgba(34,27,48,.82),rgba(15,12,20,.82));
    border:1.5px solid rgba(255,255,255,.35);
    color:var(--text);padding:10px 20px;border-radius:26px;cursor:pointer;
    font-size:15.5px;font-weight:600;letter-spacing:.5px;
    backdrop-filter:blur(6px);transition:.18s;white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.14);
    font-family:inherit;z-index:10}
  .hotspot:hover{background:linear-gradient(145deg,var(--accent),#b08a45);
    color:#1c1408;border-color:#e6c584;
    transform:translate(-50%,-50%) scale(1.09);
    box-shadow:0 6px 22px rgba(201,161,92,.5)}

  /* ===== 顶部 HUD ===== */
  #hud{position:fixed;top:0;left:0;right:240px;display:flex;gap:10px;
    padding:12px 16px;pointer-events:none;z-index:20;align-items:flex-start}
  .hud-chip{background:var(--panel);border:1px solid var(--panel-border);
    border-radius:8px;padding:6px 14px;font-size:13px;pointer-events:auto}
  #progressWrap{flex:1;max-width:320px;height:8px;margin-top:8px;
    background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
  #progressBar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .4s}

  /* ===== 右侧边栏（背包 / 线索） ===== */
  #sidebar{position:fixed;top:0;right:0;bottom:0;width:240px;z-index:60;
    background:rgba(18,14,26,.45);border-left:1px solid rgba(255,255,255,.08);
    display:flex;flex-direction:column;backdrop-filter:blur(2px)}
  #sideTabs{display:flex;border-bottom:1px solid var(--panel-border)}
  .side-tab{flex:1;padding:14px 0;text-align:center;cursor:pointer;font-size:15px;
    color:var(--dim);border-bottom:2px solid transparent}
  .side-tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:bold}
  .side-tab .badge{display:inline-block;min-width:18px;padding:1px 5px;margin-left:4px;
    border-radius:9px;background:var(--accent);color:#1c1408;font-size:11px}
  #sideBody{flex:1;overflow-y:auto;padding:12px}
  .inv-item{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:8px;
    background:rgba(255,255,255,.05);border:1px solid var(--panel-border);
    border-radius:8px;cursor:pointer;font-size:14px;transition:.15s}
  .inv-item:hover{border-color:var(--accent)}
  .inv-item .em{font-size:20px}
  .clue-item{padding:9px 10px;margin-bottom:8px;background:rgba(255,255,255,.05);
    border-left:3px solid var(--accent2);border-radius:0 8px 8px 0;font-size:13px;
    color:#e3dccb;line-height:1.6}
  .empty-hint{text-align:center;color:var(--dim);font-size:13px;padding:30px 10px;line-height:1.8}

  /* ===== 底部旁白框（图层在最上，压过边栏） ===== */
  #narration{position:fixed;left:16px;right:16px;bottom:14px;z-index:70;
    background:rgba(15,12,20,.5);border:1px solid rgba(255,255,255,.08);border-radius:12px;
    padding:14px 18px;min-height:78px;max-height:150px;overflow-y:auto;
    font-size:14.5px;line-height:1.7;backdrop-filter:blur(2px)}
  #narration .narr-old{color:var(--dim);font-size:13px}
  #narration .narr-new{color:#fff;font-size:17.5px;font-weight:600;line-height:1.75;
    text-shadow:0 1px 2px rgba(0,0,0,.5)}
  #narration .narr-ok{color:var(--ok)}
  #narration .narr-err{color:var(--danger)}

  /* ===== 特写弹窗（居中 2/3） ===== */
  #modalMask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;
    display:none;align-items:center;justify-content:center;padding-bottom:180px}
  #modalMask.show{display:flex}
  #closeup{width:62vw;max-width:860px;height:72vh;background:#1b1524;
    border:1px solid var(--panel-border);border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  #closeupHead{display:flex;justify-content:space-between;align-items:center;
    padding:10px 16px;border-bottom:1px solid var(--panel-border);flex:none}
  #closeupHead h3{font-size:17px;color:var(--accent);letter-spacing:1px}
  #closeupClose{cursor:pointer;background:rgba(255,255,255,.06);
    border:1px solid var(--panel-border);color:var(--text);font-size:15px;
    padding:5px 14px;border-radius:18px;transition:.15s}
  #closeupClose:hover{background:var(--accent);color:#1c1408;border-color:var(--accent)}
  #closeupBody{flex:1;display:flex;flex-direction:column;min-height:0}
  #closeupImg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    background:#0e0b13;position:relative;padding:12px}
  #closeupImg img{max-width:92%;max-height:98%;object-fit:contain;border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #closeupBottom{flex:none;max-height:46%;display:flex;flex-direction:column;gap:8px;
    padding:12px 16px;min-height:0;
    border-top:1px solid var(--panel-border);overflow-y:auto}
  #closeupDesc{flex:none;font-size:13px;color:#cdc5b4;line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #closeupFeedback{flex:none;display:flex;flex-direction:column;gap:5px}
  #closeupFeedback:empty{display:none}
  .fb-line{font-size:12.5px;color:var(--dim);line-height:1.5;
    background:rgba(255,255,255,.04);border-left:3px solid rgba(255,255,255,.18);
    padding:6px 10px;border-radius:0 8px 8px 0}
  .fb-line.fb-new{color:#ffe9bd;border-left-color:var(--accent);
    background:rgba(201,161,92,.10);font-weight:600}
  #closeupActs{flex:none;display:flex;flex-wrap:wrap;gap:10px}
  .act-btn{padding:12px;border-radius:10px;border:1.5px solid var(--panel-border);
    background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
    color:var(--text);font-size:15px;font-weight:600;cursor:pointer;
    text-align:center;transition:.15s;font-family:inherit;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  #closeupActs .act-btn{flex:1 1 calc(50% - 5px)}
  .act-btn:hover{background:linear-gradient(145deg,var(--accent),#b08a45);
    color:#1c1408;border-color:#e6c584;
    box-shadow:0 4px 14px rgba(201,161,92,.4)}
  .act-btn.primary{border-color:var(--accent);color:var(--accent)}
  .act-btn.primary:hover{color:#1c1408}
  .act-btn:disabled{opacity:.35;cursor:not-allowed}
  .act-btn:disabled:hover{background:rgba(255,255,255,.06);color:var(--text)}

  /* ===== 密码输入弹窗（按键键盘） ===== */
  #pwdMask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;
    display:none;align-items:center;justify-content:center;padding-bottom:180px}
  #pwdMask.show{display:flex}
  #pwdBox{background:#1b1524;border:1px solid var(--panel-border);border-radius:16px;
    padding:24px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7)}
  #pwdBox h3{margin-bottom:6px;color:var(--accent);font-size:15px}
  #pwdBox .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  #pwdDots{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
  .pwd-dot{width:38px;height:48px;border:1px solid var(--panel-border);border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:22px;
    background:rgba(255,255,255,.05);color:var(--accent);font-family:monospace}
  #pwdPad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pad-key{padding:14px 0;border-radius:10px;border:1.5px solid var(--panel-border);
    background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
    color:var(--text);font-size:18px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:.12s;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
  .pad-key:active{background:var(--accent);color:#1c1408;transform:scale(.96)}
  .pad-key.ok{border-color:var(--accent);color:var(--accent)}
  .pad-key.cancel{border-color:var(--danger);color:var(--danger)}
  #pwdMsg{margin-top:10px;font-size:12px;color:var(--danger);min-height:16px}

  /* ===== 通关界面（白底全屏结算） ===== */
  #win-bg{display:none;position:fixed;inset:0;background:#fff;z-index:150;
    align-items:center;justify-content:center}
  #win-bg .win-inner{text-align:center;color:#1a1622;padding:40px;max-width:560px}
  #win-bg h2{font-size:36px;margin:0 0 14px}
  #win-bg p{font-size:16px;color:#4a4458;line-height:1.9;margin:0 0 28px}
  #win-restart{background:#1a1622;color:#fff;border:none;padding:12px 36px;
    border-radius:8px;font-size:16px;cursor:pointer}

  /* ===== 关卡衔接页（白底黑字，点击任意位置进入下一关） ===== */
  #levelGate{position:fixed;inset:0;background:#fff;z-index:155;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:26px;cursor:pointer}
  #levelGate .gate-level{font-size:20px;letter-spacing:8px;color:#8a8494}
  #levelGate .gate-name{font-size:52px;letter-spacing:10px;color:#1a1a1a;font-weight:600}
  #levelGate .gate-hint{font-size:15px;letter-spacing:3px;color:#a8a2b0;
    animation:gatePulse 1.6s ease-in-out infinite}
  @keyframes gatePulse{0%,100%{opacity:.45}50%{opacity:1}}

  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
</style>
</head>
<body>

<!-- ===================== 开始页 ===================== -->
<div id="cover">
  <h1 class="cover-title">TEXTROOM · 密室逃脱</h1>
  <button id="cover-btn" class="cover-btn">开始游戏</button>
</div>

<!-- ===================== 场景层 ===================== -->
<div id="scene" style="display:none">
  <img id="bg" src="" alt="scene">
  <div id="hotspotHolder"></div>
</div>

<!-- ===================== 顶部 HUD ===================== -->
<div id="hud" style="display:none">
  <div class="hud-chip" id="levelName">第 1 关 · 书房</div>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div class="hud-chip" id="progressTxt">0%</div>
</div>

<!-- ===================== 右侧边栏 ===================== -->
<div id="sidebar" style="display:none">
  <div id="sideTabs">
    <div class="side-tab active" data-tab="inv">🎒 背包 <span class="badge" id="invBadge">0</span></div>
    <div class="side-tab" data-tab="clue">💡 线索 <span class="badge" id="clueBadge">0</span></div>
  </div>
  <div id="sideBody"></div>
</div>

<!-- ===================== 底部旁白 ===================== -->
<div id="narration" style="display:none"></div>

<!-- ===================== 特写弹窗 ===================== -->
<div id="modalMask">
  <div id="closeup">
    <div id="closeupHead">
      <h3 id="closeupTitle">—</h3>
      <button id="closeupClose">↩ 返回</button>
    </div>
    <div id="closeupBody">
      <div id="closeupImg"><img id="closeupPic" src="" alt="closeup"></div>
      <div id="closeupBottom">
        <div id="closeupDesc"></div>
        <div id="closeupFeedback"></div>
        <div id="closeupActs"></div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== 密码弹窗 ===================== -->
<div id="pwdMask">
  <div id="pwdBox">
    <h3 id="pwdTitle">输入密码</h3>
    <div class="sub" id="pwdSub"></div>
    <div id="pwdDots"></div>
    <div id="pwdPad"></div>
    <div id="pwdMsg"></div>
  </div>
</div>

<!-- ===================== 通关界面 ===================== -->
<div id="win-bg">
  <div class="win-inner">
    <h2>🏆 通关！</h2>
    <p id="win-text"></p>
    <button id="win-restart">再玩一次</button>
  </div>
</div>

<!-- ===================== 关卡衔接页（白底黑字） ===================== -->
<div id="levelGate">
  <div class="gate-level" id="gateLevel"></div>
  <div class="gate-name" id="gateName"></div>
  <div class="gate-hint">—— 点击任意位置继续 ——</div>
</div>

<script>
/* =====================================================================
   TextRoom 正式前端 · 布局示例 v1（沉浸式全屏）样式 + 真实后端 API
   - 全屏场景底图 + 热点按钮 → 居中特写弹窗
   - 右侧边栏：背包 / 线索；底部旁白框
   - 密码输入 = 独立弹窗（按键键盘）；电子屏 = 上下箭头弹窗
   ===================================================================== */

/* ---------- 热点坐标（按 AI 全景图实际物体位置标定，百分比） ---------- */
const HOTSPOTS = {
  study: {
    door:          {x:5,  y:55},
    bookshelf:     {x:19, y:55},
    safe:          {x:32, y:62},
    desk:          {x:44, y:64},
    clock:         {x:57, y:38},
    picture_frame: {x:68, y:36},
  },
  living_room: {
    main_gate:    {x:4,  y:47},
    fish_tank:    {x:12, y:61},
    fridge:       {x:25, y:53},
    wall_clock:   {x:28, y:22},
    sofa:         {x:41, y:59},
    coffee_table: {x:44, y:65},
    tv_cabinet:   {x:58, y:65},
    garage_door:  {x:73, y:55},
  },
  garage: {
    exit_door:  {x:19, y:37},
    remote:     {x:13, y:68},
    keypad:     {x:39, y:40},
    car:        {x:57, y:54},
    tool_board: {x:64, y:23},
    tool_box:   {x:71, y:68},
  },
};

/* 热点 / 按钮图标（按对象 ID） */
const EMOJI = {
  bookshelf:"📚", desk:"🗄", picture_frame:"🖼", clock:"🕰", safe:"🔐", door:"🚪",
  main_gate:"🚪", garage_door:"🛗", coffee_table:"🫖", fridge:"🧊",
  wall_clock:"🕰", tv_cabinet:"📺", sofa:"🛋", fish_tank:"🐟",
  exit_door:"🚪", keypad:"⌨️", remote:"📻", car:"🚗", tool_board:"🔨", tool_box:"🧰",
};

const ROOM_NAMES = {study:"书房", living_room:"客厅", garage:"车库"};

const $ = q => document.querySelector(q);

/* ---------------- 网络 ---------------- */
async function call(path, method = "GET", body = null) {
  const res = await fetch(path, {
    method,
    headers: {"Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : null,
  });
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).detail || msg; } catch {}
    throw new Error(msg);
  }
  return res.json();
}

async function send(action, params = {}) {
  try {
    const data = await call("/api/action", "POST", {action, params});
    render(data);
    pollNarrationLatest();
  } catch (err) {
    narr("⚠️ " + err.message, "narr-err");
    pushFeedback("⚠️ " + err.message);   // 错误同样进弹窗反馈区，不用看底部旁白
    // 密码弹窗开着时，错误同步到弹窗内提示
    if ($("#pwdMask").classList.contains("show")) {
      $("#pwdMsg").textContent = err.message;
      _pwdBuf = "";
      renderDots();
    }
  }
}

/* ---------------- 旁白（保留最近 4 条，旧的变暗） ---------------- */
/* 清理 LLM 润色文本里的 Markdown 残留（**加粗**、行首#、反引号） */
function cleanNarr(t) {
  return (t || "").replace(/\*\*/g, "").replace(/^#+\s*/gm, "").replace(/`/g, "");
}
function narr(msg, cls) {
  msg = cleanNarr(msg);
  const box = $("#narration");
  box.querySelectorAll(".narr-new").forEach(n => n.classList.replace("narr-new", "narr-old"));
  const div = document.createElement("div");
  div.className = "narr-new " + (cls || "");
  div.textContent = msg;
  box.appendChild(div);
  while (box.children.length > 4) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

/* ---------------- 旁白：后台 LLM 润色轮询 ---------------- */
let _narrTimer = null, _narrCount = 0;
function pollNarrationLatest() {
  if (_narrTimer) clearInterval(_narrTimer);
  _narrCount = 0;
  _narrTimer = setInterval(async () => {
    _narrCount += 1;
    try {
      const r = await fetch("/api/narration/latest");
      if (!r.ok) return;
      const data = await r.json();
      if (data && data.narration) {
        narr(data.narration);
        // 润色完成 → 同步更新弹窗反馈区的最后一条（若弹窗开着）
        if ($("#modalMask").classList.contains("show") && _fbLog.length) {
          _fbLog[_fbLog.length - 1] = data.narration;
          renderFb();
        }
        clearInterval(_narrTimer); _narrTimer = null;
        return;
      }
    } catch (_) {}
    if (_narrCount >= 8) { clearInterval(_narrTimer); _narrTimer = null; }
  }, 1500);
}

/* ---------------- 主渲染 ---------------- */
let lastData = null;
let curTab = "inv";
let _lastRoom = null;   // 用于检测关卡切换 → 弹衔接页

function render(data) {
  lastData = data;
  const state = data.state;
  const scene = data.scene;

  // 关卡衔接：房间切换（且非首次加载/非通关）→ 白底黑字衔接页，点击任意位置继续
  if (_lastRoom && state.room !== _lastRoom && !state.finished) showGate(state);
  _lastRoom = state.room;

  // 旁白
  if (data.narration) narr(data.narration);

  // HUD
  $("#levelName").textContent = `第 ${state.level} 关 · ${ROOM_NAMES[state.room] || scene.room_name}`;
  $("#progressBar").style.width = state.progress + "%";
  $("#progressTxt").textContent = state.progress + "%";

  // 通关：白底全屏结算
  if (state.finished) { showWin(data); return; }

  // 场景
  if (scene.mode === "panorama") {
    renderPanorama(scene);
  } else {
    renderCloseup(scene);
  }
  renderSide();
}

function renderPanorama(scene) {
  $("#modalMask").classList.remove("show");
  _fbObj = null; _fbLog = [];   // 离开特写，清空互动反馈日志
  const bg = $("#bg");
  if (bg.dataset.room !== scene.room_id) {   // 仅房间切换时重载底图
    bg.src = scene.image;
    bg.dataset.room = scene.room_id;
  }
  const coords = HOTSPOTS[scene.room_id] || {};
  $("#hotspotHolder").innerHTML = scene.objects.map(o => {
    const c = coords[o.id] || {x: 50, y: 50};
    const em = EMOJI[o.id] ? EMOJI[o.id] + " " : "";
    return `<button class="hotspot" style="left:${c.x}%;top:${c.y}%" data-id="${o.id}">${em}${o.name}</button>`;
  }).join("");
  document.querySelectorAll(".hotspot").forEach(el =>
    el.onclick = () => send("look", {object_id: el.dataset.id}));
}

/* ---------------- 特写弹窗 ---------------- */
/* 互动反馈日志：同一对象内保留最近 2 条（新一条高亮，上一条变暗）。
   不去重——重复操作各留一条，玩家能看出"按了两次没反应" */
let _fbLog = [], _fbObj = null;

function renderFb() {
  const fb = $("#closeupFeedback");
  fb.innerHTML = "";
  _fbLog.slice(-2).forEach((text, i, arr) => {
    const div = document.createElement("div");
    div.className = "fb-line" + (i === arr.length - 1 ? " fb-new" : "");
    div.textContent = text;
    fb.appendChild(div);
  });
}

/* 弹窗打开时手动追加一条反馈（如错误提示）；不在弹窗中则忽略 */
function pushFeedback(text) {
  if (!$("#modalMask").classList.contains("show") || !text) return;
  _fbLog.push(cleanNarr(text));
  if (_fbLog.length > 2) _fbLog = _fbLog.slice(-2);
  renderFb();
}

function renderCloseup(scene) {
  if (_fbObj !== scene.object_id) { _fbObj = scene.object_id; _fbLog = []; }
  if (lastData && lastData.narration) _fbLog.push(cleanNarr(lastData.narration));
  if (_fbLog.length > 2) _fbLog = _fbLog.slice(-2);

  $("#closeupTitle").textContent = scene.object_name || "—";
  const pic = $("#closeupPic");
  if (pic.dataset.img !== scene.image) {   // 同一特写不重复拉图，利用浏览器缓存
    pic.src = scene.image;
    pic.dataset.img = scene.image;
  }
  $("#closeupDesc").textContent = cleanNarr(scene.prereq_hint || "");

  // 反馈区：本次动作的反馈 + 上一次的反馈（联动可见）
  renderFb();

  const acts = $("#closeupActs");
  acts.innerHTML = "";

  // 该对象身上的物品：拾取 / 查看
  (scene.items || []).forEach(it => {
    if (it.pickable === false) {
      btn(acts, `查看 ${it.name}`,
          () => send("examine", {object_id: scene.object_id, item_id: it.id}));
    } else {
      btn(acts, `拾取 ${it.name}`,
          () => send("pick_up", {object_id: scene.object_id, item_id: it.id}), "primary");
    }
  });

  // 互动按钮（如掀开画框 / 电子屏上下箭头 / 走出卷帘门）
  if (scene.needs_interaction) {
    const label = scene.needs_interaction;
    if (scene.object_id === "keypad") {
      // 电子屏：点击弹出上下箭头弹窗（门未开：↑开↓无动静；门已开：↑无动静↓关）
      btn(acts, label || "查看电子屏（上下箭头）", openArrowModal, "primary");
    } else if (scene.object_id === "exit_door") {
      // 卷帘门已升起：点击走出 → 白底通关结算
      btn(acts, label, () => send("walk_out", {}), "primary");
    } else {
      btn(acts, label, () => send("interact", {object_id: scene.object_id}), "primary");
    }
  }

  // 铁皮盒刻度盘（向左/向右旋转，正好停在 6 才弹开）
  if (scene.needs_dial) {
    const d = scene.needs_dial;
    info(acts, "旋转刻度盘 · 当前停在：" + d.position);
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:10px;flex:1 1 100%";
    row.appendChild(mkBtn("向左旋转", () =>
      send("turn_dial", {object_id: scene.object_id, direction: "left"})));
    row.appendChild(mkBtn("向右旋转", () =>
      send("turn_dial", {object_id: scene.object_id, direction: "right"})));
    acts.appendChild(row);
  }

  // 密码输入
  if (scene.needs_password) {
    const np = scene.needs_password;
    btn(acts, `输入密码（${np.length} 位）`,
        () => openPasswordModal(scene.object_name, np.length), "primary");
  }

  // 需要物品解锁（如书桌需要完整钥匙）
  if (scene.needs_item_for_unlock) {
    info(acts, scene.prereq_hint || "需要特定物品");
  }

  $("#modalMask").classList.add("show");
}

function btn(parent, text, fn, cls) {
  const b = mkBtn(text, fn, cls);
  parent.appendChild(b);
  return b;
}
function mkBtn(text, fn, cls) {
  const b = document.createElement("button");
  b.className = "act-btn" + (cls ? " " + cls : "");
  b.textContent = text;
  b.onclick = fn;
  return b;
}
function info(parent, text) {
  const d = document.createElement("div");
  d.className = "act-btn";
  d.disabled = true;
  d.textContent = text;
  parent.appendChild(d);
}

$("#closeupClose").onclick = () => send("back");
$("#modalMask").onclick = e => { if (e.target.id === "modalMask") send("back"); };

/* ---------------- 密码弹窗（按键键盘） ---------------- */
let _pwdBuf = "", _pwdLen = 0;
function openPasswordModal(objName, length) {
  _pwdBuf = ""; _pwdLen = length;
  $("#pwdTitle").textContent = `🔐 ${objName} · 输入密码`;
  $("#pwdSub").textContent = `${length} 位数字密码`;
  $("#pwdMsg").textContent = "";
  renderDots(); renderPad();
  $("#pwdMask").classList.add("show");
}
function renderDots() {
  $("#pwdDots").innerHTML = Array.from({length: _pwdLen}, (_, i) =>
    `<div class="pwd-dot">${_pwdBuf[i] || ""}</div>`).join("");
}
function renderPad() {
  const keys = ["1","2","3","4","5","6","7","8","9","C","0","OK"];
  $("#pwdPad").innerHTML = keys.map(k =>
    `<button class="pad-key ${k==="OK"?"ok":k==="C"?"cancel":""}" data-k="${k}">${k}</button>`).join("");
  document.querySelectorAll(".pad-key").forEach(el =>
    el.onclick = () => padPress(el.dataset.k));
}
function padPress(k) {
  const msg = $("#pwdMsg");
  if (k === "C") { _pwdBuf = ""; msg.textContent = ""; }
  else if (k === "OK") {
    if (_pwdBuf.length < _pwdLen) { msg.textContent = `还差 ${_pwdLen - _pwdBuf.length} 位`; return; }
    $("#pwdMask").classList.remove("show");
    send("enter_password", {target_id: lastData?.scene?.object_id, code: _pwdBuf});
    return;
  }
  else if (_pwdBuf.length < _pwdLen) _pwdBuf += k;
  renderDots();
}
$("#pwdMask").onclick = e => { if (e.target.id === "pwdMask") $("#pwdMask").classList.remove("show"); };

/* 物理键盘：数字输入 / Backspace 删一位 / Enter 确认 / Esc 关闭 */
document.addEventListener("keydown", e => {
  if (!$("#pwdMask").classList.contains("show")) return;
  if (/^[0-9]$/.test(e.key)) padPress(e.key);
  else if (e.key === "Backspace") {
    _pwdBuf = _pwdBuf.slice(0, -1);
    $("#pwdMsg").textContent = "";
    renderDots();
  }
  else if (e.key === "Enter") padPress("OK");
  else if (e.key === "Escape") $("#pwdMask").classList.remove("show");
});

/* ---------------- 电子屏上下箭头弹窗 ----------------
   只有 ↑↓ 两个按钮，效果由服务端按门态分流：
   门未开：↑ 升起卷帘门 / ↓ 没有动静；门已开：↑ 没有动静 / ↓ 落下卷帘门 */
function openArrowModal() {
  const mask = document.createElement("div");
  mask.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:flex;align-items:center;justify-content:center;padding-bottom:180px;";
  const box = document.createElement("div");
  box.style.cssText = "background:#1b1524;border:1px solid var(--panel-border);border-radius:16px;padding:22px;min-width:260px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.7);";
  box.innerHTML = '<h3 style="color:var(--accent);margin:0 0 16px;font-size:16px;">⬆⬇ 电子屏 · 玻璃面板已弹开</h3>';
  const up = mkBtn("⬆", () => { mask.remove(); send("press_arrow", {direction: "up"}); }, "primary");
  up.style.cssText = "display:block;width:100%;margin:8px 0;padding:16px 0;font-size:26px;";
  const down = mkBtn("⬇", () => { mask.remove(); send("press_arrow", {direction: "down"}); });
  down.style.cssText = "display:block;width:100%;margin:8px 0;padding:16px 0;font-size:26px;";
  box.appendChild(up); box.appendChild(down);
  mask.appendChild(box); document.body.appendChild(mask);
  mask.onclick = e => { if (e.target === mask) mask.remove(); };
}

/* ---------------- 右侧边栏（背包 / 线索） ---------------- */
function renderSide() {
  if (!lastData) return;
  const state = lastData.state;
  const inv = lastData.inventory_detail || [];
  $("#invBadge").textContent = inv.length;
  $("#clueBadge").textContent = state.clues.length;
  document.querySelectorAll(".side-tab").forEach(t =>
    t.classList.toggle("active", t.dataset.tab === curTab));
  const body = $("#sideBody");
  if (curTab === "inv") {
    body.innerHTML = inv.length
      ? inv.map(i => `<div class="inv-item" data-id="${i.id}"><span class="em">${i.icon}</span><span>${i.name}</span></div>`).join("")
      : `<div class="empty-hint">背包是空的<br>去场景里找找可拾取的东西</div>`;
    body.querySelectorAll(".inv-item").forEach(el =>
      el.onclick = () => openItemMenu(el.dataset.id));
  } else {
    body.innerHTML = state.clues.length
      ? state.clues.map(c => `<div class="clue-item">${c}</div>`).join("")
      : `<div class="empty-hint">还没有线索<br>查看物品和场景会记录到这里</div>`;
  }
}
document.querySelectorAll(".side-tab").forEach(t =>
  t.onclick = () => { curTab = t.dataset.tab; renderSide(); });

/* ---------------- 物品操作菜单（查看 / 使用 / 组合） ---------------- */
function openItemMenu(id) {
  const inv = lastData?.inventory_detail || [];
  const it = inv.find(x => x.id === id);
  if (!it) return;
  const mask = document.createElement("div");
  mask.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:flex;align-items:center;justify-content:center;padding-bottom:180px;";
  const box = document.createElement("div");
  box.style.cssText = "background:#1b1524;border:1px solid var(--panel-border);border-radius:16px;padding:20px;min-width:280px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.7);";
  box.innerHTML = `<h3 style="color:var(--accent);margin:0 0 12px;font-size:15px;">${it.icon} ${it.name}</h3>`;
  const acts = document.createElement("div");
  acts.style.cssText = "display:flex;flex-direction:column;gap:8px";
  acts.appendChild(mkBtn("查看", async () => { mask.remove(); await send("inspect", {item_id: it.id}); }));

  // 使用：closeup 中直接用在此对象上；全景中给出提示（use 只能在特写中对当前对象使用）
  const curScene = lastData?.scene;
  if (curScene?.mode === "closeup" && curScene.object_id) {
    acts.appendChild(mkBtn("使用", async () => {
      mask.remove(); await send("use", {item_id: it.id, target_id: curScene.object_id});
    }));
  } else {
    acts.appendChild(mkBtn("使用", () => {
      mask.remove();
      narr(`💡 「${it.name}」需要走到具体的东西面前才能用——先点击场景里的目标看看。`);
    }));
  }
  // 组合 → 弹出其它背包物品
  if (inv.length >= 2) {
    acts.appendChild(mkBtn("组合", () => openTargetPicker(it, "combine")));
  }
  const cancel = mkBtn("取消", () => mask.remove());
  cancel.style.marginTop = "6px";
  acts.appendChild(cancel);
  box.appendChild(acts);
  mask.appendChild(box); document.body.appendChild(mask);
  mask.onclick = e => { if (e.target === mask) mask.remove(); };

  function openTargetPicker(item, mode) {
    acts.innerHTML = "";
    box.querySelector("h3").textContent =
      mode === "use" ? `把 ${item.icon} ${item.name} 用在哪儿？` : `与哪个物品组合？`;
    let candidates;
    if (mode === "use") {
      candidates = curScene?.mode === "closeup"
        ? (curScene.interactive_targets || [])
        : (curScene?.objects || []);
    } else {
      candidates = inv.filter(x => x.id !== item.id);
    }
    if (!candidates.length) {
      const d = document.createElement("div");
      d.className = "empty-hint";
      d.textContent = "（没有可用目标）";
      acts.appendChild(d);
    }
    candidates.forEach(c => {
      acts.appendChild(mkBtn(mode === "use" ? `用在 ${c.name}` : `与 ${c.name} 组合`, async () => {
        mask.remove();
        if (mode === "use") await send("use", {item_id: item.id, target_id: c.id});
        else await send("combine", {item_a: item.id, item_b: c.id});
      }));
    });
    acts.appendChild(mkBtn("取消", () => mask.remove()));
  }
}

/* ---------------- 关卡衔接页（白底黑字，点击任意位置继续） ---------------- */
function showGate(state) {
  $("#gateLevel").textContent = "第 " + state.level + " 关";
  $("#gateName").textContent = ROOM_NAMES[state.room] || "";
  $("#levelGate").style.display = "flex";
}
$("#levelGate").onclick = () => { $("#levelGate").style.display = "none"; };

/* ---------------- 通关界面（白底全屏） ---------------- */
function showWin(data) {
  $("#win-text").textContent = cleanNarr(data.narration || "你走出卷帘门，逃出了密室！");
  $("#win-bg").style.display = "flex";
}
$("#win-restart").onclick = async () => {
  $("#win-bg").style.display = "none";
  try { render(await call("/api/start", "POST", {})); pollNarrationLatest(); }
  catch (e) { narr("重开失败：" + e.message, "narr-err"); }
};

/* ---------------- 开始 ---------------- */
document.getElementById("cover-btn").addEventListener("click", async () => {
  const btnEl = document.getElementById("cover-btn");
  btnEl.disabled = true;
  const oldText = btnEl.textContent;
  btnEl.textContent = "加载中…";
  try {
    const data = await call("/api/start", "POST", {});
    document.getElementById("cover").style.display = "none";
    ["#scene", "#hud", "#sidebar", "#narration"].forEach(q =>
      document.querySelector(q).style.display = "");
    render(data);
    pollNarrationLatest();
  } catch (err) {
    alert("开局失败：" + err.message);
    btnEl.disabled = false;
    btnEl.textContent = oldText;
  }
});
</script>
